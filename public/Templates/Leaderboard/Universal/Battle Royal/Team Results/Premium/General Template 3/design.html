<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>General Template 3 - Overall Standings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #12151b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .viewport-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .canvas {
      width: 1080px;
      height: 1350px;
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
      background-color: #015f5f;
      background-image: url('Background.png');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      transform-origin: center center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
      user-select: none;
    }

    /* Arched / Rounded Event Title Section */
    .title-section {
      position: absolute;
      top: 365px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .title-svg {
      width: 1000px;
      height: 90px;
      overflow: visible;
    }

    .curved-title-text {
      font-family: 'Arial Rounded MT Bold', 'Arial Rounded MT', 'Nunito', sans-serif;
      font-size: 36px;
      font-weight: 900;
      fill: #006d6a;
      stroke: #006d6a;
      stroke-width: 1.8px;
      stroke-linejoin: round;
      stroke-linecap: round;
      paint-order: stroke fill;
      letter-spacing: 0.5px;
      text-anchor: middle;
    }

    .sparkle-char {
      font-size: 24px;
      fill: #006d6a;
      stroke: #006d6a;
      stroke-width: 1px;
    }

    /* Standings Table Container */
    .table-container {
      position: absolute;
      top: 454px;
      left: 28px;
      width: 1024px;
      border-radius: 14px;
      overflow: hidden;
      z-index: 10;
      background-color: #f3ebde;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .standings-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    /* Table Header */
    .table-header {
      background: #006d6a;
      height: 60px;
    }

    .table-header th {
      color: #ffffff;
      text-align: center;
      vertical-align: middle;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      padding: 0 6px;
      position: relative;
      border-right: 1.5px solid rgba(255, 255, 255, 0.35);
    }

    .table-header th:last-child {
      border-right: none;
    }

    .th-rank {
      width: 70px;
      font-size: 18px;
    }

    .th-team {
      width: 384px;
      text-align: left !important;
      padding-left: 22px !important;
      font-size: 18px;
    }

    .th-stat {
      width: 130px;
      line-height: 1.15;
    }

    .th-two-line {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.12;
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* Table Rows */
    .table-row {
      height: 45.6px;
      border-bottom: 1px solid #dcd3c3;
      transition: background-color 0.15s ease;
    }

    .table-row:last-child {
      border-bottom: none;
    }

    /* Alternating Cream / Linen Striping - 100% Solid Opaque */
    .table-row.row-odd {
      background: #f3ebde;
    }

    .table-row.row-even {
      background: #e8e1cf;
    }

    .table-row td {
      vertical-align: middle;
      border-right: 1px solid #dcd3c3;
      padding: 0 8px;
    }

    .table-row td:last-child {
      border-right: none;
    }

    /* Rank Cell */
    .td-rank {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      color: #18181a;
      width: 70px;
    }

    /* Team Cell */
    .td-team {
      width: 384px;
      padding-left: 18px !important;
    }

    .team-cell-content {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .team-crest-wrap {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .team-crest-wrap svg,
    .team-crest-wrap img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      display: block;
    }

    .team-name {
      font-size: 18.5px;
      font-weight: 800;
      color: #18181a;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Stat Numbers */
    .td-stat {
      text-align: center;
      font-size: 19.5px;
      font-weight: 800;
      color: #18181a;
    }

    /* Bottom Branding */
    .bottom-branding {
      position: absolute;
      bottom: 16px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      z-index: 10;
      pointer-events: none;
    }

    .made-with-text {
      font-family: 'Arial Rounded MT Bold', 'Arial Rounded MT', 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #006d6a;
      line-height: 1;
      letter-spacing: 0.4px;
    }

    .brand-logo-img {
      height: 26px;
      width: auto;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>

  <div class="viewport-container" id="viewportContainer">
    <div class="canvas" id="canvas">

      <!-- Arched / Rounded Event Title Section -->
      <div class="title-section">
        <svg class="title-svg" viewBox="0 0 1000 90">
          <defs>
            <path id="gt3TitleCurve" d="M 100,75 Q 500,20 900,75" fill="none" />
          </defs>
          <text class="curved-title-text" text-anchor="middle">
            <textPath href="#gt3TitleCurve" startOffset="50%" text-anchor="middle">
              <tspan class="sparkle-char" dy="-2">✦ </tspan>
              <tspan id="eventTitle">EVENT NAME HERE</tspan>
              <tspan class="sparkle-char" dy="-2"> ✦</tspan>
            </textPath>
          </text>
        </svg>
      </div>

      <!-- Standings Table Container -->
      <div class="table-container">
        <table class="standings-table">
          <thead>
            <tr class="table-header">
              <th class="th-rank">#</th>
              <th class="th-team">TEAM</th>
              <th class="th-stat">WINS</th>
              <th class="th-stat">
                <div class="th-two-line">
                  <span>KILL</span>
                  <span>POINTS</span>
                </div>
              </th>
              <th class="th-stat">
                <div class="th-two-line">
                  <span>PLACEMENT</span>
                  <span>POINTS</span>
                </div>
              </th>
              <th class="th-stat">
                <div class="th-two-line">
                  <span>TOTAL</span>
                  <span>POINTS</span>
                </div>
              </th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- 16 Dynamic Rows Rendered by JS -->
          </tbody>
        </table>
      </div>

      <!-- Bottom Branding: Made With + Esportific Logo -->
      <div class="bottom-branding">
        <span class="made-with-text">Made With</span>
        <img src="esportific-logo.png" alt="Esportific" class="brand-logo-img">
      </div>

    </div>
  </div>

  <script>
    // Responsive scaling
    function resizeCanvas() {
      const container = document.getElementById('viewportContainer');
      const canvas = document.getElementById('canvas');
      if (!container || !canvas) return;

      const scaleX = window.innerWidth / 1080;
      const scaleY = window.innerHeight / 1350;
      const scale = Math.min(scaleX, scaleY, 1);

      canvas.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('DOMContentLoaded', resizeCanvas);

    // 16 Authentic Preset Team Logos (Matching original reference image)
    const CREST_SVGS = [
      // 1. Phoenix / Red Bird
      `<svg viewBox="0 0 24 24" fill="#d91d1d"><path d="M12 2L14 7L19 4L16 9L22 10L17 14L20 19L14 16L12 22L10 16L4 19L7 14L2 10L8 9L5 4L10 7Z"/></svg>`,
      // 2. Titans / Blue Shield
      `<svg viewBox="0 0 24 24"><path d="M12 2L4 5V11C4 16.5 7.4 21.6 12 23C16.6 21.6 20 16.5 20 11V5L12 2Z" fill="#182848"/><path d="M7 8H17V11H13.5V18H10.5V11H7V8Z" fill="#ffffff"/></svg>`,
      // 3. Shadow Clan / Purple Hood
      `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#2d124d"/><path d="M12 4C8 4 6 8 6 12C6 16 9 20 12 20C15 20 18 16 18 12C18 8 16 4 12 4ZM9 12L10.5 13.5L9 15L7.5 13.5L9 12ZM15 12L16.5 13.5L15 15L13.5 13.5L15 12Z" fill="#a855f7"/></svg>`,
      // 4. Royal Kings / Crown
      `<svg viewBox="0 0 24 24" fill="#eab308"><path d="M3 18H21V20H3V18ZM4 6L8.5 10L12 4L15.5 10L20 6L18.5 16H5.5L4 6Z"/></svg>`,
      // 5. Vortex / Blue Swirl
      `<svg viewBox="0 0 24 24" fill="#0284c7"><path d="M12 2A10 10 0 1 0 22 12A10 10 0 0 0 12 2Zm0 17a7 7 0 1 1 7-7 7 7 0 0 1-7 7Zm-2-7a2 2 0 1 1 2 2 2 2 0 0 1-2-2Z"/></svg>`,
      // 6. Team Nexus / Orange Diamond N
      `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="#ea580c"/><path d="M7 7H10L14 13V7H17V17H14L10 11V17H7V7Z" fill="#ffffff"/></svg>`,
      // 7. Blaze / Orange Flame
      `<svg viewBox="0 0 24 24" fill="#f97316"><path d="M12 2C9 7 6 9 6 13C6 17 9 21 12 22C15 21 18 17 18 13C18 10 16 6 12 2ZM12 19C10.5 19 9 17.5 9 15C9 13 10.5 11 12 10C13.5 11 15 13 15 15C15 17.5 13.5 19 12 19Z"/></svg>`,
      // 8. Eclipse / Crescent
      `<svg viewBox="0 0 24 24" fill="#0f172a"><path d="M12 2A10 10 0 1 0 22 12A10 10 0 0 0 12 2Z"/></svg>`,
      // 9. Quantum / Atom
      `<svg viewBox="0 0 24 24" fill="#2563eb"><circle cx="12" cy="12" r="3"/><path d="M12 3C7 3 3 7 3 12S7 21 12 21 21 17 21 12 17 3 12 3ZM12 19C8.1 19 5 15.9 5 12S8.1 5 12 5 19 8.1 19 12 15.9 19 12 19Z"/></svg>`,
      // 10. Apex / Red Delta
      `<svg viewBox="0 0 24 24"><polygon points="12,2 22,20 2,20" fill="#dc2626"/><polygon points="12,8 18,18 6,18" fill="#ffffff"/></svg>`,
      // 11. Inferno / Dark Red Beast
      `<svg viewBox="0 0 24 24" fill="#991b1b"><path d="M12 2L15 8L21 9L16.5 13.5L18 20L12 16.5L6 20L7.5 13.5L3 9L9 8L12 2Z"/></svg>`,
      // 12. Celestials / Wings
      `<svg viewBox="0 0 24 24" fill="#06b6d4"><path d="M12 3C7 3 3 8 3 13C3 18 8 21 12 21C16 21 21 18 21 13C21 8 17 3 12 3ZM7 14L10 11L12 14L14 11L17 14L12 18L7 14Z"/></svg>`,
      // 13. Nova Esports / Star Trails
      `<svg viewBox="0 0 24 24" fill="#9333ea"><polygon points="12,1 15,9 23,10 17,16 19,23 12,19 5,23 7,16 1,10 9,9"/></svg>`,
      // 14. Revenant / Skull
      `<svg viewBox="0 0 24 24" fill="#1e293b"><circle cx="12" cy="10" r="7"/><rect x="8" y="15" width="8" height="6" rx="2"/><circle cx="9.5" cy="10" r="1.5" fill="#ffffff"/><circle cx="14.5" cy="10" r="1.5" fill="#ffffff"/></svg>`,
      // 15. Nemesis / Hexagon
      `<svg viewBox="0 0 24 24" fill="#450a0a"><polygon points="12,2 21,7 21,17 12,22 3,17 3,7"/></svg>`,
      // 16. Horizon / Sun & Mountain
      `<svg viewBox="0 0 24 24" fill="#d97706"><circle cx="12" cy="8" r="4"/><path d="M2 20L8 12L13 18L17 14L22 20H2Z"/></svg>`,
    ];

    const DEFAULT_TEAMS = [
      { rank: 1, name: 'Phoenix Esports', wins: 0, kills: 0, placePts: 0, totalPts: 0 },
      { rank: 2, name: 'Titans', wins: 0, kills: 0, placePts: 0, totalPts: 0 },
      { rank: 3, name: 'Shadow Clan', wins: 0, kills: 0, placePts: 0, totalPts: 0 },
      { rank: 4, name: 'Royal Kings', wins: 0, kills: 0, placePts: 0, totalPts: 0 },
      { rank: 5, name: 'Vortex', wins: 0, kills: 0, placePts: 0, totalPts: 0 },
      { rank: 6, name: 'Team Nexus', wins: 0, kills: 0, placePts: 0, totalPts: 0 },
      { rank: 7, name: 'Blaze', wins: 0, kills: 0, placePts: 0, totalPts: 0 },
      { rank: 8, name: 'Eclipse', wins: 0, kills: 0, placePts: 0, totalPts: 0 },
      { rank: 9, name: 'Quantum', wins: 0, kills: 0, placePts: 0, totalPts: 0 },
      { rank: 10, name: 'Apex', wins: 0, kills: 0, placePts: 0, totalPts: 0 },
      { rank: 11, name: 'Inferno', wins: 0, kills: 0, placePts: 0, totalPts: 0 },
      { rank: 12, name: 'Celestials', wins: 0, kills: 0, placePts: 0, totalPts: 0 },
      { rank: 13, name: 'Nova Esports', wins: 0, kills: 0, placePts: 0, totalPts: 0 },
      { rank: 14, name: 'Revenant', wins: 0, kills: 0, placePts: 0, totalPts: 0 },
      { rank: 15, name: 'Nemesis', wins: 0, kills: 0, placePts: 0, totalPts: 0 },
      { rank: 16, name: 'Horizon', wins: 0, kills: 0, placePts: 0, totalPts: 0 },
    ];

    function renderTable(teams) {
      const tbody = document.getElementById('tableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      const padded = [...teams];
      while (padded.length < 16) {
        padded.push({
          rank: padded.length + 1,
          name: '',
          wins: 0,
          kills: 0,
          placePts: 0,
          totalPts: 0
        });
      }

      padded.slice(0, 16).forEach((team, idx) => {
        const tr = document.createElement('tr');
        tr.className = `table-row ${idx % 2 === 0 ? 'row-odd' : 'row-even'}`;

        const crestSvg = team.logoUrl
          ? `<img src="${team.logoUrl}" alt="${team.name}">`
          : (CREST_SVGS[idx % CREST_SVGS.length] || '');

        tr.innerHTML = `
          <td class="td-rank">${team.rank ?? (idx + 1)}</td>
          <td class="td-team">
            <div class="team-cell-content">
              <div class="team-crest-wrap">
                ${crestSvg}
              </div>
              <span class="team-name">${team.name || (team.team ?? '')}</span>
            </div>
          </td>
          <td class="td-stat">${team.wins ?? 0}</td>
          <td class="td-stat">${team.kills ?? team.killPts ?? team.killPoints ?? 0}</td>
          <td class="td-stat">${team.placePts ?? team.placementPts ?? team.placementPoints ?? 0}</td>
          <td class="td-stat">${team.totalPts ?? team.points ?? team.totalPoints ?? 0}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function applyData() {
      const params = new URLSearchParams(window.location.search);
      const titleParam = params.get('title');

      if (titleParam) {
        document.getElementById('eventTitle').textContent = titleParam;
      }

      if (window.templateData && Array.isArray(window.templateData.teams)) {
        renderTable(window.templateData.teams);
      } else {
        renderTable(DEFAULT_TEAMS);
      }
    }

    applyData();
  </script>
</body>
</html>
