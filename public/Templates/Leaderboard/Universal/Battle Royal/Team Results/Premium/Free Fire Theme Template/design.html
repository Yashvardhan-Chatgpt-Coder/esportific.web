<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Fire Theme Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Sedgwick+Ave&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    /* Outer responsive viewport for fitting 1080x1350 canvas */
    .viewport-container {
      width: 1080px;
      height: 1350px;
      position: relative;
      transform-origin: center center;
    }

    .canvas {
      width: 1080px;
      height: 1350px;
      position: relative;
      background-color: #0a0a0c;
      background-image: url('Background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    /* Top Left Free Fire Wordmark Logo */
    .free-fire-logo {
      position: absolute;
      top: 34px;
      left: 38px;
      height: 38px;
      width: auto;
      object-fit: contain;
      z-index: 15;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
    }

    /* Dynamic Event Name Banner Container (Below STANDINGS) */
    .banner-container {
      position: absolute;
      top: 458px;
      left: 395px;
      transform: translate(-50%, 0) rotate(-2.8deg);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .banner-svg-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Standings Table Container */
    .table-container {
      position: absolute;
      top: 536px;
      left: 38px;
      width: 1004px;
      height: 724px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      z-index: 10;
      background: transparent;
    }

    .standings-table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
    }

    /* Header Styling with heavy bold block font matching reference */
    .standings-table thead tr {
      background-color: #ef4303;
      height: 56px;
    }

    .th-col {
      color: #ffffff;
      font-family: 'Arial Black', Gadget, 'Impact', Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 0 4px;
      border: none;
    }

    .th-rank {
      width: 68px;
      text-align: center;
      font-size: 19px;
    }

    .th-team {
      width: 356px;
      text-align: left;
      padding-left: 28px;
      font-size: 16px;
    }

    .th-stat {
      width: 145px;
      text-align: center;
      font-size: 16px;
      border-left: 1px solid rgba(255, 255, 255, 0.22);
    }

    .th-two-line {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.12;
    }

    .th-two-line span {
      font-size: 13.5px;
    }

    /* Row Styling */
    .standings-table tbody tr {
      height: 41.75px;
      border-bottom: 1px solid rgba(215, 202, 185, 0.45);
    }

    .standings-table tbody tr:last-child {
      border-bottom: none;
    }

    .row-odd {
      background-color: #f7ede1;
    }

    .row-even {
      background-color: #ede4d5;
    }

    /* Rank Number */
    .td-rank {
      text-align: center;
      font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #18181a;
    }

    /* Team Cell */
    .td-team {
      padding-left: 20px;
    }

    .team-cell-content {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .team-crest {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .team-crest svg,
    .team-crest img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      display: block;
    }

    .team-name {
      font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
      font-size: 16.5px;
      font-weight: 700;
      color: #18181a;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Stats */
    .td-stat {
      text-align: center;
      font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
      font-size: 17.5px;
      font-weight: 700;
      color: #18181a;
    }

    /* Bottom Branding: Made With & Esportific Logo */
    .bottom-brand {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      z-index: 20;
      pointer-events: none;
    }

    .made-with-text {
      font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      opacity: 0.9;
      line-height: 1;
      letter-spacing: 0.6px;
    }

    .brand-logo {
      height: 24px;
      width: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.7));
    }
  </style>
</head>
<body>

  <div class="viewport-container" id="viewportContainer">
    <div class="canvas" id="canvas">

      <!-- Top Left Free Fire Wordmark Logo -->
      <img src="free-fire-white.png" alt="Free Fire" class="free-fire-logo">

      <!-- Dynamic SVG Brush Banner Container -->
      <div class="banner-container" id="bannerContainer">
        <!-- Rendered by renderBrushBanner() -->
      </div>

      <!-- Standings Table Container -->
      <div class="table-container">
        <table class="standings-table">
          <thead>
            <tr>
              <th class="th-col th-rank">#</th>
              <th class="th-col th-team">TEAM</th>
              <th class="th-col th-stat">WINS</th>
              <th class="th-col th-stat">
                <div class="th-two-line">
                  <span>KILL</span>
                  <span>POINTS</span>
                </div>
              </th>
              <th class="th-col th-stat">
                <div class="th-two-line">
                  <span>PLACEMENT</span>
                  <span>POINTS</span>
                </div>
              </th>
              <th class="th-col th-stat">
                <div class="th-two-line">
                  <span>TOTAL</span>
                  <span>POINTS</span>
                </div>
              </th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- 16 Dynamic Rows Rendered by JS -->
          </tbody>
        </table>
      </div>

      <!-- Bottom Branding: Made With & Esportific Logo -->
      <div class="bottom-brand">
        <span class="made-with-text">Made With</span>
        <img src="esportific-logo.png" alt="Esportific" class="brand-logo">
      </div>

    </div>
  </div>

  <script>
    // 16 Authentic Preset Team Logos
    const PRESET_TEAMS = [
      { name: "Phoenix Esports", crest: '<svg viewBox="0 0 24 24" fill="#d91d1d"><path d="M12 2L14 7L19 4L16 9L22 10L17 14L20 19L14 16L12 22L10 16L4 19L7 14L2 10L8 9L5 4L10 7Z"/></svg>' },
      { name: "Titans", crest: '<svg viewBox="0 0 24 24"><path d="M12 2L4 5V11C4 16.5 7.4 21.6 12 23C16.6 21.6 20 16.5 20 11V5L12 2Z" fill="#182848"/><path d="M7 8H17V11H13.5V18H10.5V11H7V8Z" fill="#ffffff"/></svg>' },
      { name: "Shadow Clan", crest: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#2d124d"/><path d="M12 4C8 4 6 8 6 12C6 16 9 20 12 20C15 20 18 16 18 12C18 8 16 4 12 4ZM9 12L10.5 13.5L9 15L7.5 13.5L9 12ZM15 12L16.5 13.5L15 15L13.5 13.5L15 12Z" fill="#a855f7"/></svg>' },
      { name: "Royal Kings", crest: '<svg viewBox="0 0 24 24" fill="#eab308"><path d="M3 18H21V20H3V18ZM4 6L8.5 10L12 4L15.5 10L20 6L18.5 16H5.5L4 6Z"/></svg>' },
      { name: "Vortex", crest: '<svg viewBox="0 0 24 24" fill="#0284c7"><path d="M12 2A10 10 0 1 0 22 12A10 10 0 0 0 12 2Zm0 17a7 7 0 1 1 7-7 7 7 0 0 1-7 7Zm-2-7a2 2 0 1 1 2 2 2 2 0 0 1-2-2Z"/></svg>' },
      { name: "Team Nexus", crest: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="#ea580c"/><path d="M7 7H10L14 13V7H17V17H14L10 11V17H7V7Z" fill="#ffffff"/></svg>' },
      { name: "Blaze", crest: '<svg viewBox="0 0 24 24" fill="#f97316"><path d="M12 2C9 7 6 9 6 13C6 17 9 21 12 22C15 21 18 17 18 13C18 10 16 6 12 2ZM12 19C10.5 19 9 17.5 9 15C9 13 10.5 11 12 10C13.5 11 15 13 15 15C15 17.5 13.5 19 12 19Z"/></svg>' },
      { name: "Eclipse", crest: '<svg viewBox="0 0 24 24" fill="#0f172a"><path d="M12 2A10 10 0 1 0 22 12A10 10 0 0 1 12 2Z"/></svg>' },
      { name: "Quantum", crest: '<svg viewBox="0 0 24 24" fill="#2563eb"><circle cx="12" cy="12" r="3"/><path d="M12 3C7 3 3 7 3 12S7 21 12 21 21 17 21 12 17 3 12 3ZM12 19C8.1 19 5 15.9 5 12S8.1 5 12 5 19 8.1 19 12 15.9 19 12 19Z"/></svg>' },
      { name: "Apex", crest: '<svg viewBox="0 0 24 24"><polygon points="12,2 22,20 2,20" fill="#dc2626"/><polygon points="12,8 18,18 6,18" fill="#ffffff"/></svg>' },
      { name: "Inferno", crest: '<svg viewBox="0 0 24 24" fill="#991b1b"><path d="M12 2L15 8L21 9L16.5 13.5L18 20L12 16.5L6 20L7.5 13.5L3 9L9 8L12 2Z"/></svg>' },
      { name: "Celestials", crest: '<svg viewBox="0 0 24 24" fill="#06b6d4"><path d="M12 3C7 3 3 8 3 13C3 18 8 21 12 21C16 21 21 18 21 13C21 8 17 3 12 3ZM7 14L10 11L12 14L14 11L17 14L12 18L7 14Z"/></svg>' },
      { name: "Nova Esports", crest: '<svg viewBox="0 0 24 24" fill="#9333ea"><polygon points="12,1 15,9 23,10 17,16 19,23 12,19 5,23 7,16 1,10 9,9"/></svg>' },
      { name: "Revenant", crest: '<svg viewBox="0 0 24 24" fill="#1e293b"><circle cx="12" cy="10" r="7"/><rect x="8" y="15" width="8" height="6" rx="2"/><circle cx="9.5" cy="10" r="1.5" fill="#ffffff"/><circle cx="14.5" cy="10" r="1.5" fill="#ffffff"/></svg>' },
      { name: "Nemesis", crest: '<svg viewBox="0 0 24 24" fill="#0f172a"><polygon points="12,2 21,7 21,17 12,22 3,17 3,7"/><circle cx="12" cy="12" r="5" fill="#f97316"/></svg>' },
      { name: "Horizon", crest: '<svg viewBox="0 0 24 24"><defs><linearGradient id="hz" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#1e3a8a"/></linearGradient></defs><circle cx="12" cy="12" r="10" fill="url(#hz)"/><circle cx="12" cy="10" r="4" fill="#fef08a"/><rect x="4" y="12" width="16" height="2" fill="#1e3a8a"/></svg>' }
    ];

    // Responsive scaling to fit window
    function resizeCanvas() {
      const container = document.getElementById('viewportContainer');
      if (!container) return;

      const scaleX = window.innerWidth / 1080;
      const scaleY = window.innerHeight / 1350;
      const scale = Math.min(scaleX, scaleY, 1);

      container.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      renderTable();
      renderBrushBanner("EVENT NAME HERE");
    });

    // Populate Standings Table Rows
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      let html = '';

      PRESET_TEAMS.forEach((team, index) => {
        const rank = index + 1;
        const rowClass = (index % 2 === 0) ? 'row-odd' : 'row-even';

        html += `
          <tr class="${rowClass}">
            <td class="td-rank">${rank}</td>
            <td class="td-team">
              <div class="team-cell-content">
                <div class="team-crest">${team.crest}</div>
                <span class="team-name">${team.name}</span>
              </div>
            </td>
            <td class="td-stat">0</td>
            <td class="td-stat">0</td>
            <td class="td-stat">0</td>
            <td class="td-stat">0</td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    /**
     * DYNAMIC SVG BRUSH-STROKE BANNER GENERATOR
     */
    function renderBrushBanner(eventName) {
      const bannerContainer = document.getElementById('bannerContainer');
      const cleanName = (eventName || "EVENT NAME HERE").trim();

      const textCharWidth = cleanName.length <= 10 ? 17 : 14.5;
      const calculatedWidth = Math.max(340, Math.min(780, cleanName.length * textCharWidth + 110));
      const W = calculatedWidth;
      const H = 58;

      const leftW = 45;
      const rightW = 55;
      const rightStart = W - rightW;

      const brushPath = `
        M 0,22
        L 2,19 L 6,18 L 10,18 L 16,17 L 22,17 L 28,16 L 36,15 L 45,14
        Q ${W * 0.5},1 ${rightStart},6
        L ${W - 48},5 L ${W - 36},6 L ${W - 24},8 L ${W - 14},8 L ${W - 4},7 L ${W},8
        L ${W - 12},17 L ${W - 2},20 L ${W - 8},25 L ${W - 18},28 L ${W - 6},32 L ${W - 16},36
        L ${W - 4},40 L ${W - 14},44 L ${W - 22},46 L ${W - 38},47 L ${rightStart},48
        Q ${W * 0.5},54 ${leftW},51
        L 34,51 L 24,50 L 16,49 L 10,48 L 4,45 L 8,38 L 2,34 L 7,28 L 0,22
        Z
      `;

      const leftDashes = `
        <g transform="translate(-46, 10)" fill="#fba000">
          <polygon points="4,24 28,16 26,19 2,27" />
          <polygon points="10,36 34,31 32,34 8,39" />
        </g>
      `;

      const rightDashes = `
        <g transform="translate(${W + 12}, 10)" fill="#fba000">
          <polygon points="4,16 28,24 26,27 2,19" />
          <polygon points="6,31 30,36 28,39 4,34" />
        </g>
      `;

      const svg = `
        <div class="banner-svg-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="${W + 80}" height="${H + 16}" viewBox="-55 -4 ${W + 110} ${H + 16}">
            <defs>
              <filter id="brushShadow" x="-10%" y="-10%" width="130%" height="130%">
                <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.6"/>
              </filter>
            </defs>

            ${leftDashes}
            ${rightDashes}

            <path d="${brushPath}" fill="#fba000" filter="url(#brushShadow)" />

            <text
              x="${W * 0.5}"
              y="32"
              font-family="'Permanent Marker', 'Sedgwick Ave', cursive, sans-serif"
              font-size="25"
              font-weight="900"
              fill="#08080a"
              text-anchor="middle"
              dominant-baseline="middle"
              letter-spacing="1.4"
            >${cleanName}</text>
          </svg>
        </div>
      `;

      bannerContainer.innerHTML = svg;
    }
  </script>
</body>
</html>
