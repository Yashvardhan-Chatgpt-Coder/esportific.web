<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top 5 Shooters — General 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0e12;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    #viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Exact Canvas matching Background.png (1122 x 1402 px) */
    .poster {
      width: 1122px;
      height: 1402px;
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
      background-image: url('Background.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center center;
      transform-origin: center center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
    }

    /* TOP BRANDING LOGO */
    .brand-logo-area {
      position: absolute;
      top: 32px;
      left: 50px;
      z-index: 5;
    }
    .brand-logo-img {
      height: 25px;
      width: auto;
      object-fit: contain;
    }

    /* SLANTED RECTANGLE WITH 3 STRIPES (EVENT NAME) */
    .event-pill-row {
      position: absolute;
      left: 47px;
      top: 388px;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .slanted-pill {
      background: #ff5801;
      transform: skewX(-24deg);
      padding: 7px 22px 6px 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .slanted-pill-text {
      transform: skewX(24deg);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
    }

    .slanted-strips {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .slanted-strips span {
      display: block;
      width: 5.5px;
      height: 31px;
      background: #ff5801;
      transform: skewX(-24deg);
    }

    /* 5 CARDS CONTENT LAYER */
    .cards-container {
      position: absolute;
      top: 850px;
      left: 0;
      width: 1122px;
      height: 350px;
      pointer-events: none;
      z-index: 5;
    }

    .card-slot {
      position: absolute;
      top: 0;
      width: 198px;
      height: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Exact horizontal positions aligned with cards in Background.png */
    .card-slot-1 { left: 38px; }
    .card-slot-2 { left: 252px; }
    .card-slot-3 { left: 467px; }
    .card-slot-4 { left: 679px; }
    .card-slot-5 { left: 893px; }

    /* Upper white section of card: Player Name, Team Logo, Team Name */
    .card-upper-section {
      width: 100%;
      height: 195px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 20px;
    }

    .player-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.2px;
      color: #111827;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 15px;
      max-width: 184px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team-logo-wrap {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .team-logo-img {
      max-width: 60px;
      max-height: 60px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .team-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #111827;
      text-transform: uppercase;
      line-height: 1.15;
      max-width: 184px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Lower tinted box section: KILLS label and Kill count number */
    .card-lower-section {
      width: 100%;
      height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 18px;
    }

    .kills-label {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #334155;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 4px;
    }

    .kills-count {
      font-family: 'Bebas Neue', 'Plus Jakarta Sans', sans-serif;
      font-size: 68px;
      font-weight: 700;
      color: #ff5801;
      line-height: 0.95;
      letter-spacing: 0.5px;
    }

    /* FOOTER BAR */
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 54px;
      padding-right: 50px;
      z-index: 10;
    }

    .footer-made-with {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 5px;
    }
    .made-with-label {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-transform: none;
      line-height: 1;
    }
    .esportific-brand-logo {
      height: 29px;
      width: auto;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .footer-tagline {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #111113;
      text-transform: uppercase;
    }
    .footer-tagline .booyah {
      color: #ff5801;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div class="poster" id="poster">

      <!-- TOP BRANDING LOGO -->
      <div class="brand-logo-area">
        <img class="brand-logo-img" src="free-fire-logo.png" alt="Free Fire">
      </div>

      <!-- SLANTED RECTANGLE WITH 3 STRIPES (EVENT NAME) -->
      <div class="event-pill-row">
        <div class="slanted-pill">
          <span class="slanted-pill-text" id="event-name-text">AFTER MATCH 04</span>
        </div>
        <div class="slanted-strips">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <!-- 5 CARDS CONTENT LAYER -->
      <div class="cards-container">

        <!-- CARD 1 (RANK 1) -->
        <div class="card-slot card-slot-1">
          <div class="card-upper-section">
            <div class="player-name">KAIROS</div>
            <div class="team-logo-wrap">
              <img class="team-logo-img" src="logo-nexus.png" alt="Team Nexus">
            </div>
            <div class="team-name">TEAM NEXUS</div>
          </div>
          <div class="card-lower-section">
            <div class="kills-label">KILLS</div>
            <div class="kills-count">24</div>
          </div>
        </div>

        <!-- CARD 2 (RANK 2) -->
        <div class="card-slot card-slot-2">
          <div class="card-upper-section">
            <div class="player-name">LUNA</div>
            <div class="team-logo-wrap">
              <img class="team-logo-img" src="logo-phoenix.png" alt="Phoenix Esports">
            </div>
            <div class="team-name">PHOENIX ESPORTS</div>
          </div>
          <div class="card-lower-section">
            <div class="kills-label">KILLS</div>
            <div class="kills-count">18</div>
          </div>
        </div>

        <!-- CARD 3 (RANK 3) -->
        <div class="card-slot card-slot-3">
          <div class="card-upper-section">
            <div class="player-name">ZORO</div>
            <div class="team-logo-wrap">
              <img class="team-logo-img" src="logo-eclipse.png" alt="Eclipse">
            </div>
            <div class="team-name">ECLIPSE</div>
          </div>
          <div class="card-lower-section">
            <div class="kills-label">KILLS</div>
            <div class="kills-count">15</div>
          </div>
        </div>

        <!-- CARD 4 (RANK 4) -->
        <div class="card-slot card-slot-4">
          <div class="card-upper-section">
            <div class="player-name">RYZEN</div>
            <div class="team-logo-wrap">
              <img class="team-logo-img" src="logo-apex.png" alt="Apex Union">
            </div>
            <div class="team-name">APEX UNION</div>
          </div>
          <div class="card-lower-section">
            <div class="kills-label">KILLS</div>
            <div class="kills-count">12</div>
          </div>
        </div>

        <!-- CARD 5 (RANK 5) -->
        <div class="card-slot card-slot-5">
          <div class="card-upper-section">
            <div class="player-name">NOVA</div>
            <div class="team-logo-wrap">
              <img class="team-logo-img" src="logo-royal-kings.png" alt="Royal Kings">
            </div>
            <div class="team-name">ROYAL KINGS</div>
          </div>
          <div class="card-lower-section">
            <div class="kills-label">KILLS</div>
            <div class="kills-count">11</div>
          </div>
        </div>

      </div>

      <!-- FOOTER BAR -->
      <footer class="footer">
        <div class="footer-made-with">
          <span class="made-with-label">Made with</span>
          <img src="esportific-logo.png" alt="Esportific" class="esportific-brand-logo" />
        </div>

        <div class="footer-tagline" id="footer-tagline">
          <span>Compete. Survive. </span>
          <span class="booyah">Booyah!</span>
        </div>
      </footer>

    </div>
  </div>

  <script>
    // Helper function to extract ONLY the first word of a player's name
    function formatPlayerName(name) {
      if (!name) return "";
      return String(name).trim().split(/\s+/)[0].toUpperCase();
    }

    // Auto scale-to-fit: ensures the entire 1122x1402 poster is fully visible in viewport without scrolling
    function fitPoster() {
      const poster = document.getElementById('poster');
      if (!poster) return;
      const targetW = 1122;
      const targetH = 1402;
      const pad = 24;
      const availW = window.innerWidth - pad;
      const availH = window.innerHeight - pad;
      const scale = Math.min(availW / targetW, availH / targetH);
      poster.style.transform = `scale(${scale}) translateZ(0)`;
    }

    window.addEventListener('resize', fitPoster);
    window.addEventListener('DOMContentLoaded', fitPoster);
    window.addEventListener('load', fitPoster);
    fitPoster();

    // Dynamic data setter
    window.setShootersData = function(data) {
      if (data.eventName) {
        document.getElementById('event-name-text').textContent = data.eventName;
      }
      if (data.shooters && Array.isArray(data.shooters)) {
        data.shooters.slice(0, 5).forEach(function(shooter, index) {
          var card = document.querySelector('.card-slot-' + (index + 1));
          if (!card) return;
          var nameEl = card.querySelector('.player-name');
          var logoEl = card.querySelector('.team-logo-img');
          var teamEl = card.querySelector('.team-name');
          var killsEl = card.querySelector('.kills-count');

          if (nameEl && shooter.player) nameEl.textContent = formatPlayerName(shooter.player);
          if (logoEl && shooter.teamLogoSrc) logoEl.src = shooter.teamLogoSrc;
          if (teamEl && shooter.team) teamEl.textContent = shooter.team.toUpperCase();
          if (killsEl && (shooter.kills !== undefined)) killsEl.textContent = shooter.kills;
        });
      }
    };
  </script>
</body>
</html>
